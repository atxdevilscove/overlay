<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Stream Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .overlay-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .photo-item {
            position: absolute;
            opacity: 0;
            transition: all 0.8s ease-in-out;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 15px;
            max-width: 280px;
            transform: rotate(0deg);
        }

        .photo-item.visible {
            opacity: 1;
        }

        .photo-item.fade-out {
            opacity: 0;
            transform: scale(0.9) rotate(5deg);
        }

        .photo-img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            margin-bottom: 10px;
        }

        .photo-name {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #333;
            margin: 0;
        }

        /* Position slots for multiple images */
        .position-1 {
            top: 10%;
            right: 5%;
            transform: rotate(-3deg);
        }

        .position-2 {
            bottom: 15%;
            left: 8%;
            transform: rotate(2deg);
        }

        .position-1.visible {
            transform: rotate(-3deg) scale(1);
        }

        .position-2.visible {
            transform: rotate(2deg) scale(1);
        }

        /* Debug info - remove for production */
        .debug-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <!-- Debug info - remove for production -->
        <div class="debug-info" id="debugInfo">
            Queue: <span id="queueCount">0</span> | 
            Displaying: <span id="displayingCount">0</span> | 
            Next: <span id="nextTimer">--</span>s
        </div>
    </div>

    <script>
        // Mock photo queue - in real implementation, this would come from your server
        const mockPhotos = [
            { id: 1, name: "Sarah M.", image: "https://images.unsplash.com/photo-1494790108755-2616b612b5bc?w=300&h=300&fit=crop&crop=face" },
            { id: 2, name: "Alex K.", image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&h=300&fit=crop&crop=face" },
            { id: 3, name: "Maria L.", image: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=300&h=300&fit=crop&crop=face" },
            { id: 4, name: "James R.", image: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=300&h=300&fit=crop&crop=face" },
            { id: 5, name: "Emma T.", image: "https://images.unsplash.com/photo-1489424731084-a5d8b219a5bb?w=300&h=300&fit=crop&crop=face" },
            { id: 6, name: "David C.", image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300&h=300&fit=crop&crop=face" },
            { id: 7, name: "Lisa P.", image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&h=300&fit=crop&crop=face" },
            { id: 8, name: "Michael B.", image: "https://images.unsplash.com/photo-1463453091185-61582044d556?w=300&h=300&fit=crop&crop=face" },
            { id: 9, name: "Anna S.", image: "https://images.unsplash.com/photo-1502685104226-ee32379fefbe?w=300&h=300&fit=crop&crop=face" },
            { id: 10, name: "Chris W.", image: "https://images.unsplash.com/photo-1507591064344-4c6ce005b128?w=300&h=300&fit=crop&crop=face" }
        ];

        // Configuration
        const CONFIG = {
            maxConcurrentImages: 2,
            displayDurationMs: 3000,
            checkIntervalMs: 1000,
            fadeAnimationMs: 800
        };

        // State management
        let photoQueue = [...mockPhotos];
        let currentlyDisplaying = [];
        let usedPositions = [];
        let nextCheckTime = Date.now() + CONFIG.checkIntervalMs;
        let currentPhotoIndex = 0; // Track position in photo array

        // Available positions for photos
        const positions = ['position-1', 'position-2'];

        function createPhotoElement(photo, positionClass) {
            const photoDiv = document.createElement('div');
            photoDiv.className = `photo-item ${positionClass}`;
            photoDiv.innerHTML = `
                <img src="${photo.image}" alt="${photo.name}" class="photo-img" />
                <p class="photo-name">${photo.name}</p>
            `;
            return photoDiv;
        }

        function getAvailablePosition() {
            for (let position of positions) {
                if (!usedPositions.includes(position)) {
                    return position;
                }
            }
            return null;
        }

        function displayPhoto(photo) {
            const availablePosition = getAvailablePosition();
            if (!availablePosition) {
                console.log('No available positions');
                return false;
            }

            const photoElement = createPhotoElement(photo, availablePosition);
            document.querySelector('.overlay-container').appendChild(photoElement);

            // Mark position as used
            usedPositions.push(availablePosition);

            // Trigger fade in
            setTimeout(() => {
                photoElement.classList.add('visible');
            }, 50);

            // Store reference for cleanup
            const displayItem = {
                id: photo.id,
                element: photoElement,
                position: availablePosition,
                startTime: Date.now()
            };

            currentlyDisplaying.push(displayItem);

            // Schedule removal
            setTimeout(() => {
                removePhoto(displayItem);
            }, CONFIG.displayDurationMs);

            console.log(`Displaying photo: ${photo.name} at ${availablePosition}`);
            return true;
        }

        function removePhoto(displayItem) {
            // Find and remove from currently displaying
            const index = currentlyDisplaying.findIndex(item => item.id === displayItem.id);
            if (index === -1) return;

            currentlyDisplaying.splice(index, 1);

            // Free up the position
            const positionIndex = usedPositions.indexOf(displayItem.position);
            if (positionIndex > -1) {
                usedPositions.splice(positionIndex, 1);
            }

            // Fade out animation
            displayItem.element.classList.add('fade-out');
            displayItem.element.classList.remove('visible');

            // Remove from DOM after animation
            setTimeout(() => {
                if (displayItem.element.parentNode) {
                    displayItem.element.parentNode.removeChild(displayItem.element);
                }
            }, CONFIG.fadeAnimationMs);

            console.log(`Removed photo at ${displayItem.position}`);
        }

        function processQueue() {
            // Always cycle through photos continuously
            if (currentlyDisplaying.length < CONFIG.maxConcurrentImages) {
                const nextPhoto = mockPhotos[currentPhotoIndex];
                currentPhotoIndex = (currentPhotoIndex + 1) % mockPhotos.length; // Loop back to start
                displayPhoto(nextPhoto);
            }

            updateDebugInfo();
        }

        function updateDebugInfo() {
            const remainingInCycle = mockPhotos.length - currentPhotoIndex;
            document.getElementById('queueCount').textContent = `${remainingInCycle} (cycling)`;
            document.getElementById('displayingCount').textContent = currentlyDisplaying.length;
            
            const timeToNext = Math.max(0, Math.ceil((nextCheckTime - Date.now()) / 1000));
            document.getElementById('nextTimer').textContent = timeToNext;
        }

        function startOverlaySystem() {
            console.log('Starting photo overlay system...');
            
            // Initial processing
            processQueue();

            // Set up interval for queue processing
            setInterval(() => {
                processQueue();
                nextCheckTime = Date.now() + CONFIG.checkIntervalMs;
            }, CONFIG.checkIntervalMs);

            // Update debug info more frequently
            setInterval(updateDebugInfo, 100);
        }

        // Start the system when page loads
        window.addEventListener('load', startOverlaySystem);

        // Optional: Log when we complete a full cycle
        function logCycleCompletion() {
            if (currentPhotoIndex === 0) {
                console.log('Completed full photo cycle, starting over...');
            }
        }
    </script>
</body>
</html>
